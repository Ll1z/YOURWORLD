[project]
name = "geoanalyst"
version = "0.1.0"
description = "地理空间分析 Agent（个人学习项目）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.2",
    "mcp>=2.2.0",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "shapely>=2.1.2",
]
